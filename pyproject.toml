[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenpanel"
version = "0.1.0"
description = "System tray panel showing Claude Code and Codex token usage"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["PySide6>=6.4"]

[project.scripts]
tokenpanel = "tokenpanel.__main__:main"

[tool.setuptools]
packages = ["tokenpanel"]
