name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - run: ruff check .

  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install tzdata
      - run: python -m unittest discover -s tests -t . -v

  windows-exe:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install "PySide6>=6.4" tzdata pyinstaller
      - name: Build TokenPanel.exe
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python packaging/make_icons.py ico packaging/windows/tokenpanel.ico
          pyinstaller --noconfirm packaging/windows/tokenpanel.spec
      - name: Smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          [Console]::OutputEncoding = [Text.UTF8Encoding]::new($false)
          $logs = Join-Path $env:RUNNER_TEMP "logs"
          python scripts/sample_logs.py $logs
          $dirs = @("--claude-dir", "$logs\claude", "--codex-dir", "$logs\codex", "--opencode-dir", "$logs\opencode")
          $exe = Resolve-Path dist\TokenPanel.exe

          # --dump: reads the sample logs (Windows-style paths) and prints the summary.
          $p = Start-Process $exe -ArgumentList (@("--dump", "--range", "today") + $dirs) -Wait -PassThru `
            -RedirectStandardOutput dump.txt -RedirectStandardError dump-err.txt
          Get-Content dump.txt, dump-err.txt
          if ($p.ExitCode -ne 0) { throw "--dump exited with $($p.ExitCode)" }
          foreach ($want in "Claude Code · CLI", "Codex · Desktop", "OpenCode · All clients", "token-panel", "API cost") {
            if (-not (Select-String -Path dump.txt -SimpleMatch $want -Quiet)) { throw "--dump output lacks '$want'" }
          }

          # The command the README gives: piping makes PowerShell wait for the GUI program and capture its output.
          $piped = & $exe --dump --range today @dirs | Out-String
          if ($piped -notmatch "Codex") { throw "piped --dump printed nothing: '$piped'" }
          # Same on a Turkish console (code page 857): letters must survive, symbols it lacks become ASCII.
          [Console]::OutputEncoding = [Text.Encoding]::GetEncoding(857)
          $piped = & $exe --dump --range today @dirs | Out-String
          [Console]::OutputEncoding = [Text.UTF8Encoding]::new($false)
          $piped
          if (-not $piped.Contains("Yanıtla çiz")) { throw "Turkish letters were garbled on code page 857" }
          if (-not $piped.Contains("[Codex · Desktop]")) { throw "middle dot was garbled on code page 857" }

          # --self-test: opens the panel and renders every level, with the real Windows platform plugin
          # and with the offscreen one.
          foreach ($platform in "", "offscreen") {
            $env:QT_QPA_PLATFORM = $platform
            $p = Start-Process $exe -ArgumentList (@("--self-test") + $dirs) -Wait -PassThru `
              -RedirectStandardOutput test.txt -RedirectStandardError test-err.txt
            Get-Content test.txt, test-err.txt
            if ($p.ExitCode -ne 0) { throw "--self-test ($platform) exited with $($p.ExitCode)" }
          }
          "{0:N1} MB" -f ((Get-Item $exe).Length / 1MB)
      - uses: actions/upload-artifact@v4
        with:
          name: TokenPanel-windows
          path: dist/TokenPanel.exe
          if-no-files-found: error

  macos-app:
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install "PySide6>=6.4" pyinstaller
      - name: Build TokenPanel.app
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -euo pipefail
          python packaging/make_icons.py iconset "$RUNNER_TEMP/tokenpanel.iconset"
          iconutil -c icns "$RUNNER_TEMP/tokenpanel.iconset" -o packaging/macos/tokenpanel.icns
          pyinstaller --noconfirm packaging/macos/tokenpanel.spec
          # Unsigned apps still need an ad-hoc signature to run on Apple Silicon.
          codesign --force --deep --sign - dist/TokenPanel.app
          codesign --verify --deep --strict dist/TokenPanel.app
          lipo -archs dist/TokenPanel.app/Contents/MacOS/TokenPanel | grep -qw "${{ matrix.arch }}"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSUIElement' dist/TokenPanel.app/Contents/Info.plist)" = true
      - name: Smoke test
        run: |
          set -euo pipefail
          logs="$RUNNER_TEMP/logs"
          python scripts/sample_logs.py "$logs"
          exe=dist/TokenPanel.app/Contents/MacOS/TokenPanel
          dirs=(--claude-dir "$logs/claude" --codex-dir "$logs/codex" --opencode-dir "$logs/opencode")

          # --dump: reads the sample logs and prints the summary.
          "$exe" --dump --range today "${dirs[@]}" | tee dump.txt
          for want in "Claude Code · CLI" "Codex · Desktop" "OpenCode · All clients" "token-panel" "Yanıtla çiz" \
            "API cost"; do
            grep -qF "$want" dump.txt || { echo "--dump output lacks '$want'"; exit 1; }
          done

          # --self-test: opens the panel and renders every level, with the real Cocoa platform plugin
          # and with the offscreen one.
          "$exe" --self-test "${dirs[@]}"
          QT_QPA_PLATFORM=offscreen "$exe" --self-test "${dirs[@]}"

          ditto -c -k --keepParent dist/TokenPanel.app "TokenPanel-macos-${{ matrix.arch }}.zip"
          du -sh dist/TokenPanel.app TokenPanel-macos-*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: TokenPanel-macos-${{ matrix.arch }}
          path: TokenPanel-macos-${{ matrix.arch }}.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows-exe, macos-app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: TokenPanel-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            TokenPanel.exe
            TokenPanel-macos-*.zip
          generate_release_notes: true
